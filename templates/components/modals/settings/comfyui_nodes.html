{% import 'components/modals/settings/_macros.html' as sm with context %}
<!-- ComfyUI node settings are registered by the plugin frontend, not the LM backend. -->
<div id="section-comfyuiNodes" class="settings-section" data-section="comfyuiNodes" data-comfyui-only>
    <div class="settings-subsection">
        {{ sm.subsection_header('settings.comfyuiNodes.title') }}
        <p class="settings-help-text input-help">
            {{ t('settings.comfyuiNodes.description') }}
        </p>
        <div class="comfyui-nodes-action">
            <button type="button" class="primary-btn" id="openComfyUISettingsBtn" data-open-comfyui-settings>
                <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                <span>{{ t('settings.comfyuiNodes.openButton') }}</span>
            </button>
        </div>
    </div>
</div>
